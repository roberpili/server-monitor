server {
    listen 80;
    server_name localhost;

    # Increase body size limit for log payloads
    client_max_body_size 10M;

    # Log collection endpoint
    location /api/logs {
        # Log the incoming request
        access_log /var/log/nginx/log-collector-access.log combined;
        error_log /var/log/nginx/log-collector-error.log;

        # Accept POST requests with JSON body
        if ($request_method != 'POST') {
            return 405;
        }

        # Return success
        add_header Content-Type application/json;
        return 200 '{"status":"ok","message":"Logs received"}';
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        return 200 'healthy';
    }
}
