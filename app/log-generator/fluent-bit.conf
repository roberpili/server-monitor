[SERVICE]
    Flush         5
    Log_Level     info
    Daemon        off
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020

[INPUT]
    Name              tail
    Path              /app/logs/*.log
    Parser            json
    Tag               app.logs
    Refresh_Interval  5
    Rotate_Wait       30
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

[FILTER]
    Name          modify
    Match         app.logs
    Add           container_name ${HOSTNAME}
    Add           service_name log-generator

[OUTPUT]
    Name                http
    Match               app.logs
    Host                ${FLUENT_BIT_OUTPUT_HOST}
    Port                ${FLUENT_BIT_OUTPUT_PORT}
    URI                 ${FLUENT_BIT_OUTPUT_URI}
    Format              json
    Header              Content-Type application/json
    Header              Authorization Bearer ${FLUENT_BIT_OUTPUT_TOKEN}
    Compress            gzip
    Retry_Limit         3
    Json_Date_Format    iso8601
